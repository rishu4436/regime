[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teamwork-trading-agent"
version = "0.1.0"
description = "Autonomous trading agent for tokenized on-chain stocks (Binance Web3 API / Agentic Wallet)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6,<3",
  "httpx>=0.27",
  "numpy>=1.26",
  "pandas>=2.1",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend"]
pythonpath = ["."]
addopts = "-q --import-mode=importlib"
